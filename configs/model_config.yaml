models:
  baseline:
    name: "baseline"
    type: "sklearn"
    enabled: true
    models:
      - name: "logistic_regression"
        class: "sklearn.linear_model.LogisticRegression"
        params:
          C: 1.0
          class_weight: "balanced"
          max_iter: 1000
          random_state: 42
      - name: "random_forest"
        class: "sklearn.ensemble.RandomForestClassifier"
        params:
          n_estimators: 200
          max_depth: 20
          min_samples_split: 5
          class_weight: "balanced"
          random_state: 42
          n_jobs: -1
      - name: "gradient_boosting"
        class: "sklearn.ensemble.GradientBoostingClassifier"
        params:
          n_estimators: 200
          max_depth: 5
          learning_rate: 0.1
          random_state: 42

  tfidf:
    name: "tfidf"
    type: "sklearn"
    enabled: true
    vectorizer:
      class: "sklearn.feature_extraction.text.TfidfVectorizer"
      params:
        max_features: 15000
        ngram_range: [1, 3]
        min_df: 2
        max_df: 0.95
        sublinear_tf: true
        strip_accents: "unicode"
    classifier:
      class: "sklearn.linear_model.SGDClassifier"
      params:
        loss: "log_loss"
        penalty: "elasticnet"
        alpha: 0.0001
        l1_ratio: 0.15
        max_iter: 1000
        tol: 0.001
        class_weight: "balanced"
        random_state: 42

  transformer:
    name: "transformer"
    type: "huggingface"
    enabled: true
    model_name: "roberta-base"
    tokenizer_name: "roberta-base"
    max_sequence_length: 512
    num_labels: 2
    id2label:
      0: "REAL"
      1: "FAKE"
    label2id:
      REAL: 0
      FAKE: 1
    training:
      output_dir: "models/transformer"
      num_train_epochs: 5
      per_device_train_batch_size: 16
      per_device_eval_batch_size: 32
      learning_rate: 2.0e-5
      weight_decay: 0.01
      warmup_ratio: 0.1
      logging_steps: 100
      eval_strategy: "steps"
      eval_steps: 500
      save_strategy: "steps"
      save_steps: 500
      load_best_model_at_end: true
      metric_for_best_model: "f1"
      greater_is_better: true
      report_to: ["mlflow", "tensorboard"]
      fp16: true
      gradient_accumulation_steps: 2
      max_grad_norm: 1.0
    inference:
      batch_size: 32
      device: "auto"

  ensemble:
    name: "ensemble"
    type: "ensemble"
    enabled: true
    method: "stacking"
    meta_learner: "sklearn.linear_model.LogisticRegression"
    base_models:
      - "tfidf"
      - "transformer"
      - "baseline"
    weights:
      tfidf: 0.3
      transformer: 0.5
      baseline: 0.2
    calibration:
      enabled: true
      method: "isotonic"

  calibration:
    name: "calibration"
    type: "post_processing"
    enabled: true
    method: "temperature_scaling"
    validation_split: 0.2

data:
  label_mapping:
    real: 0
    fake: 1
    true: 0
    false: 1
    0: 0
    1: 1
  class_weights:
    method: "balanced"
  sampling:
    method: "smote"
    random_state: 42
