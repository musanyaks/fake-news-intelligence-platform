services:
  - type: web
    name: truthlens-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m api.main
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: USE_MOCK_MODEL
        value: true
      - key: GOOGLE_FACT_CHECK_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
