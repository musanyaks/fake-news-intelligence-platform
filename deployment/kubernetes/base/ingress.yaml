apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fakenews-api
  namespace: fakenews
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - api.fakenews-intelligence.local
      secretName: fakenews-tls
  rules:
    - host: api.fakenews-intelligence.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fakenews-api
                port:
                  number: 80
