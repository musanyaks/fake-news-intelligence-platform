apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakenews-api
  namespace: fakenews
  labels:
    app: fakenews-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fakenews-api
  template:
    metadata:
      labels:
        app: fakenews-api
    spec:
      containers:
        - name: api
          image: ghcr.io/fake-news-intelligence-platform/fake-news-intelligence-platform:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fakenews-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fakenews-secrets
                  key: database-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fakenews-secrets
                  key: secret-key
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
