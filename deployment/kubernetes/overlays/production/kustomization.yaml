apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fakenews-prod

resources:
  - ../../base

namePrefix: prod-

replicas:
  - name: fakenews-api
    count: 5

patches:
  - target:
      kind: Deployment
      name: fakenews-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "4Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4000m"
