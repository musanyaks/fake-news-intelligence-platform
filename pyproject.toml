[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-news-intelligence-platform"
version = "0.1.0"
description = "Production-grade fake news detection and intelligence platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Fake News Intelligence Team", email = "team@fakenews-intelligence.local"}
]
keywords = ["machine-learning", "fake-news", "nlp", "transformers", "mlops", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "transformers>=4.35.0",
    "torch>=2.1.0",
    "tokenizers>=0.14.0",
    "sentencepiece>=0.1.99",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "kafka-python>=2.0.2",
    "pyspark>=3.5.0",
    "mlflow>=2.8.0",
    "optuna>=3.4.0",
    "shap>=0.43.0",
    "prometheus-client>=0.19.0",
    "evidently>=0.4.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0,<0.28.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "nltk>=3.8.1",
    "spacy>=3.7.0",
    "textstat>=0.7.3",
    "vaderSentiment>=3.3.2",
    "celery>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
    "pre-commit>=3.5.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.26.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
]

[project.scripts]
fakenews-train = "training.train:main"
fakenews-api = "api.main:main"

[project.urls]
Homepage = "https://github.com/fake-news-intelligence-platform"
Documentation = "https://fake-news-intelligence-platform.readthedocs.io"
Repository = "https://github.com/fake-news-intelligence-platform/fake-news-intelligence-platform"
Issues = "https://github.com/fake-news-intelligence-platform/fake-news-intelligence-platform/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["src", "api", "training"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "api: API tests",
    "model: Model tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src", "api", "training"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.",
]
